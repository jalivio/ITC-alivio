<!DOCTYPE html>
<html>
<head>
  <title>Guest Access - Restricted Mode</title>
  <link rel="icon" type="image/png" href="/imgfile/hello.png">
  <style>
    :root { --accent: #ccc; --accent-rgb: 200,200,200; }

    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      height: 100vh;
      overflow: hidden;
      background-color: black;
      color: white;
    }

    #matrix-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .dashboard-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
      gap: 20px;
      position: relative; 
      z-index: 1;
    }

    .glass-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 0, 0, 0.3);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
      border-radius: 10px;
    }

    .header {
      padding: 20px;
      text-align: center;
      flex-shrink: 0;
      border-bottom: 2px solid #3b0000;
    }
    
    .header h1 {
      margin: 0;
      letter-spacing: 4px;
      font-weight: lighter;
      text-transform: uppercase;
      color: #ccc; /* Grey color for Guest mode */
      text-shadow: 0 0 10px #aaa; 
    }

    .main-body {
      display: flex;
      flex: 1;
      gap: 20px;
      overflow: hidden;
    }

    .sidebar {
      width: 280px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .content-area {
      flex: 1;
      padding: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .content-scroll {
        padding: 40px;
        overflow-y: auto;
        height: 100%;
    }

    .nav-btn {
      padding: 15px;
      text-align: left;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.2s;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Courier New', Courier, monospace;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1); 
      border-color: #fff;
      color: #fff;
      padding-left: 20px;
    }

    .logout-btn {
      margin-top: auto;
      background: rgba(255, 50, 50, 0.1);
      border: 1px solid rgba(255, 50, 50, 0.3);
      text-align: center;
      font-weight: bold;
      color: #ffaaaa;
    }

    .logout-btn:hover {
      background: rgba(255, 50, 50, 0.3);
      padding-left: 15px;
      color: white;
      text-shadow: 0 0 5px red;
    }

    /* Iframe Containers */
    .iframe-full {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
    }

    h2 {
        color: #fff;
        border-bottom: 1px solid #777;
        padding-bottom: 10px;
    }

  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <div class="dashboard-container">
    
    <header class="header glass-panel">
      <h1>TVL-ICT Dashboard <span style="font-size: 0.5em; color: #888; vertical-align: middle;">[ GUEST MODE ]</span></h1>
    </header>

    <div class="main-body">
      
      <aside class="sidebar glass-panel">
        <button class="nav-btn" onclick="loadProgramming()">Online Programming</button>
        <button class="nav-btn" onclick="loadRobotics()">Robotics Simulator</button>
        <button class="nav-btn" onclick="loadAssignments()">Assignments</button>
        
        <button class="nav-btn logout-btn" onclick="logout()">Exit Guest Mode</button>
      </aside>

      <main id="main-content" class="content-area glass-panel">
        <div class="content-scroll">
            <h2>Welcome, Guest</h2>
            <p>You are logged in with limited privileges.</p>
            <p>Personal data, schedules, and activity logs are <span style="color: #ff5555;">[ ENCRYPTED / HIDDEN ]</span>.</p>
            <br>
            <p>Select a tool from the sidebar to begin.</p>
        </div>
      </main>
      
    </div>
  </div>

  <script src="assignments.js"></script>
  <script>
    function logout() {
      window.location.href = "login.html"; 
    }

    function loadProgramming() {
      const content = document.getElementById("main-content");
      content.innerHTML = `
        <iframe 
            src="https://onecompiler.com/" 
            class="iframe-full"
            style="filter: invert(0.9) hue-rotate(180deg);" 
            sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
        ></iframe>
      `;
    }

    function loadRobotics() {
        const content = document.getElementById("main-content");
        content.innerHTML = `
            <div style="height: 100%; display: flex; flex-direction: column;">
                <div style="padding: 10px; background: #000; border-bottom: 1px solid #fff;">
                    <span style="color:#fff;">>> LOAD:</span> Arduino Uno Simulator (Wokwi)
                </div>
                <iframe 
                    src="https://wokwi.com/projects/new/arduino-uno?dark=1" 
                    class="iframe-full"
                    style="border:none;"
                ></iframe>
            </div>
        `;
    }

    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const alphabet = katakana + latin + nums;

    const fontSize = 16;
    const columns = canvas.width / fontSize; 

    const rainDrops = [];

    for (let x = 0; x < columns; x++) {
      rainDrops[x] = 1;
    }

    const draw = () => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#AAAAAA'; 
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    };

    setInterval(draw, 30);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
