<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="icon" type="image/png" href="/imgfile/hello.png"> 
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      
      background-image: url('/imgfile/bgfilelain.jpg');   
      background-size: cover;     
      background-position: center; 
      background-repeat: no-repeat; 
    }

    .login-box {
      width: 300px;
      padding: 40px;
      
      display: flex;            
      flex-direction: column;   
      gap: 15px;                

      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);    
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 10px;          
      color: white;          
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); 
    }

    h2 {
      text-align: center;
      margin: 0 0 10px 0; 
      font-weight: lighter; 
      letter-spacing: 2px;
    }

    input {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      outline: none;
      color: white;
      border-radius: 5px;
      box-sizing: border-box; 
    }
    
    ::placeholder { 
      color: #ccc;
      opacity: 1; 
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #ffffff;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #ddd;
    }

    .guest-btn {
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-weight: normal;
    }

    .guest-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-color: white;
      color: white;
    }

    #msg {
      text-align: center;
      margin: 0;
      font-size: 0.9rem;
      min-height: 20px; 
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    
    <button onclick="login()">Login</button>
    <button class="guest-btn" onclick="guestLogin()">Continue as Guest</button>
    
    <p id="msg"></p>
  </div>

  <script>
    const correctUsername = "admin";
    const correctPassword = "1234"; 

    document.getElementById("username").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById("password").focus();
      }
    });

    document.getElementById("password").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        login();
      }
    });

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      if (user === correctUsername && pass === correctPassword) {
        msg.innerText = "Login successful! Redirecting...";
        msg.style.color = "#4CAF50";
        
        setTimeout(function() {
            window.location.href = "dashboard.html"; 
        }, 1000);

      } else {
        msg.innerText = "Invalid credentials";
        msg.style.color = "#ff4d4d";
      }
    }

    function guestLogin() {
      window.location.href = "guest_dashboard.html";
    }
  </script>

</body>
</html>
