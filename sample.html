<!DOCTYPE html>

<html>
  <title>Haiku-esque</title>

  <body>
    <h1><b>Warrior's Fate</b></h1>
    <h2><i>By: John Mikel Alivio</i></h2>

    <br /><br />Overwhelming force, <br />Heading to uncertainty, <br />Rushing
    to the end.

    <br /><br />Destroying our past, <br />Deeply breathe in the despair,
    <br />Broken and consumed.

    <br /><br />Brilliant it blossoms, <br />Stuggle and cry out for help,
    <br />Shattered, yet alive.
  </body>
</html>
